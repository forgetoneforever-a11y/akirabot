services:
  - type: web
    name: akira-cookie-clicker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: PGSSL
        value: "false"
databases:
  - name: akira-db
    plan: free
    databaseName: akira
    user: akira_user
