services:
  - type: web
    name: akira-clicker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: akira-database
          property: connectionString
      - key: BOT_TOKEN
        sync: false

databases:
  - name: akira-database
    plan: free
